<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vinay Token Sale</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
</head>

<body>
    <div class="container" style="width: 650px;">
        <div class="row">
            <div class="col-lg-12">
                <h1 class="text-center">VIN TOKEN SALE</h1>
                <hr />
                <br />
            </div>
            <div id="debug-log"
                style="text-align: left; margin: 20px 0; border: 2px solid #333; padding: 15px; background: #f9f9f9; min-height: 100px;">
                <h4 style="margin-top: 0;">Debug Log:</h4>
            </div>
            <div id="loader">
                <p class="text-center">Loading...</p>
            </div>
            <div id="content" class="text-center" style="display: none;">
                <p>
                    Introducing "Vinay Token" (VIN)!
                    Token Price is <span class="token-price"></span> Ether. You currently have <span
                        class="dapp-balance"></span>&nbsp;VIN.
                </p>
                <br />
                <form onSubmit="App.buyTokens(); return false;" role="form">
                    <div class="form-group">
                        <div class="input-group">
                            <input id="numberOfTokens" class="form-control input-lg" type="number" name="number"
                                value="1" min="1" pattern="[0-9]">
                            </span class="input-group-btn">
                            <button type="submit" class="btn btn-primary btn-lg">Buy Tokens</button>
                            </span>
                        </div>
                    </div>
                </form>
                <br>
                <hr>
                <h3>Transfer VIN Tokens</h3>
                <form onSubmit="App.transferTokens(); return false;" role="form">
                    <div class="form-group">
                        <label for="recipientAddress">Recipient Address:</label>
                        <input id="recipientAddress" class="form-control" type="text" placeholder="0x..."
                            pattern="^0x[a-fA-F0-9]{40}$" required>
                    </div>
                    <div class="form-group">
                        <div class="input-group">
                            <input id="transferAmount" class="form-control input-lg" type="number" name="amount"
                                value="1" min="1" pattern="[0-9]" required>
                            <span class="input-group-btn">
                                <button type="submit" class="btn btn-success btn-lg">Transfer VIN</button>
                            </span>
                        </div>
                    </div>
                </form>
                <br>
                <div class="progress">
                    <div id="progress" class="progress-bar progress-bar-striped active" aria-valuemin="0"
                        aria-valuemax="100">
                    </div>
                </div>
                <p><span class="tokens-sold"></span> / <span class="tokens-available"></span> tokens sold</p>
                <hr>
                <p id="accountAddress"></p>
            </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
        integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@truffle/contract@4.3.5/dist/truffle-contract.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
